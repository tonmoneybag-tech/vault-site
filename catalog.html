let filters = { search: '', topic: 'all', subsMin: null, subsMax: null, priceMin: null, priceMax: null, sort: 'subs-desc' };
let cart = new Set();

function formatNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace('.0','') + 'M';
  if (n >= 1000) return (n/1000).toFixed(0) + 'K';
  return n.toString();
}
function formatPrice(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
}
function firstLetter(name) {
  const cleaned = name.replace(/^[\s\p{Emoji}\p{S}]+/gu, '');
  return cleaned.trim().charAt(0).toUpperCase() || 'V';
}

function filterChannels() {
  let list = CHANNELS.slice();
  if (filters.search) {
    const q = filters.search.toLowerCase();
    list = list.filter(c => c.name.toLowerCase().includes(q));
  }
  if (filters.topic !== 'all') list = list.filter(c => c.topic === filters.topic);
  if (filters.subsMin != null) list = list.filter(c => c.subs >= filters.subsMin);
  if (filters.subsMax != null) list = list.filter(c => c.subs <= filters.subsMax);
  if (filters.priceMin != null) list = list.filter(c => c.price >= filters.priceMin);
  if (filters.priceMax != null) list = list.filter(c => c.price <= filters.priceMax);

  switch (filters.sort) {
    case 'subs-desc': list.sort((a,b) => b.subs - a.subs); break;
    case 'subs-asc': list.sort((a,b) => a.subs - b.subs); break;
    case 'price-asc': list.sort((a,b) => (a.price||0) - (b.price||0)); break;
    case 'price-desc': list.sort((a,b) => (b.price||0) - (a.price||0)); break;
    case 'er-desc': list.sort((a,b) => b.er - a.er); break;
  }
  return list;
}

function renderChannelCard(c) {
  const topic = TOPICS[c.topic] || TOPICS.other;
  const inCart = cart.has(c.id);
  const gradient = `linear-gradient(135deg, ${topic.color[0]}, ${topic.color[1]})`;
  const safeName = c.name.replace(/</g, '&lt;').replace(/>/g, '&gt;');

  let priceHtml;
  if (c.priceLabel) {
    priceHtml = `<div class="font-black text-sm gradient-text" style="font-family:'Unbounded'">${c.priceLabel}</div>`;
  } else if (c.price > 0) {
    priceHtml = `<div class="font-black text-lg gradient-text" style="font-family:'Unbounded'">${formatPrice(c.price)}</div>`;
  } else {
    priceHtml = `<div class="font-black text-sm gradient-text" style="font-family:'Unbounded'">По запросу</div>`;
  }

  const fmtBadge = `<span class="format-badge">${c.formatNote || '1/24'}</span>`;
  const cartBtn = c.price > 0
    ? `<button class="cart-btn ${inCart ? 'cart-btn-remove' : 'cart-btn-add'}" onclick="toggleCart(${c.id})">${inCart ? 'Убрать' : 'В корзину'}</button>`
    : `<a href="${c.link}" target="_blank" rel="noopener" class="cart-btn cart-btn-add" style="text-decoration:none">Подробнее</a>`;

  return `
    <div class="channel-card p-6 ${inCart ? 'in-cart' : ''}" data-id="${c.id}">
      <div class="flex items-start gap-4 mb-5">
        <div class="channel-avatar" style="background:${gradient}">${firstLetter(c.name)}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <a href="/channel" class="font-bold truncate hover:text-[var(--vault-blue)] transition" style="color:var(--vault-ink); text-decoration:none; display:block;" title="${safeName}">
              <h3 class="font-bold truncate">${safeName}</h3>
            </a>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded platform-tag-tg">TG</span>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold" style="color:var(--vault-ink-muted)">${topic.label}</span>
            <a href="${c.link}" target="_blank" rel="noopener" class="channel-link">↗ открыть</a>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-5 text-center">
        <div><div class="font-black text-base" style="color:var(--vault-ink); font-family:'Unbounded'">${formatNum(c.subs)}</div><div class="text-[10px] font-bold uppercase" style="color:var(--vault-ink-muted)">Подп.</div></div>
        <div><div class="font-black text-base" style="color:var(--vault-ink); font-family:'Unbounded'">${formatNum(c.reach)}</div><div class="text-[10px] font-bold uppercase" style="color:var(--vault-ink-muted)">Охват</div></div>
        <div><div class="font-black text-base" style="color:var(--vault-ink); font-family:'Unbounded'">~${c.er}%</div><div class="text-[10px] font-bold uppercase" style="color:var(--vault-ink-muted)">ER</div></div>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-[rgba(10,115,232,0.1)]">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[10px] font-bold uppercase" style="color:var(--vault-ink-muted)">Цена</span>
            ${fmtBadge}
          </div>
          ${priceHtml}
        </div>
        ${cartBtn}
      </div>
    </div>
  `;
}

function renderGrid() {
  const list = filterChannels();
  const grid = document.getElementById('channels-grid');
  const empty = document.getElementById('empty-state');
  document.getElementById('results-count').textContent = list.length;

  if (list.length === 0) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    grid.innerHTML = list.map(renderChannelCard).join('');
  }
}

function renderCartBar() {
  const bar = document.getElementById('cart-bar');
  const count = cart.size;
  if (count === 0) { bar.classList.remove('visible'); return; }
  const sum = Array.from(cart).reduce((acc, id) => {
    const c = CHANNELS.find(x => x.id === id);
    return acc + (c && c.price ? c.price : 0);
  }, 0);
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-sum').textContent = formatPrice(sum);
  bar.classList.add('visible');
}

function toggleCart(id) {
  if (cart.has(id)) cart.delete(id);
  else cart.add(id);
  renderGrid();
  renderCartBar();
}

function renderTopicChips() {
  const counts = {};
  CHANNELS.forEach(c => { counts[c.topic] = (counts[c.topic] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);

  const container = document.getElementById('topic-chips');
  let html = `<button class="topic-chip active" data-topic="all">Все<span class="count">${CHANNELS.length}</span></button>`;
  sorted.forEach(([topic, count]) => {
    const t = TOPICS[topic] || TOPICS.other;
    html += `<button class="topic-chip" data-topic="${topic}">${t.label}<span class="count">${count}</span></button>`;
  });
  container.innerHTML = html;

  container.querySelectorAll('.topic-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.topic-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filters.topic = btn.dataset.topic;
      renderGrid();
    });
  });
}

document.getElementById('search-input').addEventListener('input', e => { filters.search = e.target.value.trim(); renderGrid(); });
document.getElementById('sort-select').addEventListener('change', e => { filters.sort = e.target.value; renderGrid(); });
['subs-min','subs-max','price-min','price-max'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const val = e.target.value === '' ? null : parseInt(e.target.value);
    const key = id.replace('-min','Min').replace('-max','Max');
    filters[key] = val;
    renderGrid();
  });
});

function resetFilters() {
  filters = { search: '', topic: 'all', subsMin: null, subsMax: null, priceMin: null, priceMax: null, sort: 'subs-desc' };
  document.getElementById('search-input').value = '';
  document.getElementById('subs-min').value = '';
  document.getElementById('subs-max').value = '';
  document.getElementById('price-min').value = '';
  document.getElementById('price-max').value = '';
  document.getElementById('sort-select').value = 'subs-desc';
  document.querySelectorAll('.topic-chip').forEach(b => b.classList.toggle('active', b.dataset.topic === 'all'));
  renderGrid();
}
document.getElementById('reset-filters').addEventListener('click', resetFilters);

document.getElementById('total-channels-hdr').textContent = CHANNELS.length;
const totalSubs = CHANNELS.reduce((acc, c) => acc + c.subs, 0);
document.getElementById('total-subs').textContent = formatNum(totalSubs) + '+';

renderTopicChips();
renderGrid();
renderCartBar();
</script>
